    <circle cx="110" cy="112" r="96" fill="#2a3d52"/>
    <circle cx="110" cy="112" r="92" fill="#1a2840"/>

    <g clip-path="url(#clip)">
      <rect x="18" y="20" width="184" height="108" fill="url(#top)"/>
      <path d="M14 132 C58 139 104 124 140 96 C167 75 189 60 212 51 L212 216 L14 216 Z" fill="url(#bottom)"/>
      <path d="M10 127 C63 141 113 124 151 94 C177 74 194 64 216 55" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

